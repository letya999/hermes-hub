version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /docker/browser
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    ignore:
      # Upstream hermes-agent pins requires-python <3.14; python base-image
      # majors cannot build until upstream widens the range.
      - dependency-name: "python"
        update-types: ["version-update:semver-major"]
