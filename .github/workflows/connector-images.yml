name: Connector Images
# Builds a reviewed catalog entry through the same restricted generator local
# admission uses, pushes the attested OCI archive to GHCR and verifies the
# pushed manifest digest before producing the catalog pin patch. Dispatch-only:
# publishing an image is an explicit owner action, never a push side effect.
on:
  workflow_dispatch:
    inputs:
      entry:
        description: Prepared catalog entry id (e.g. playwright-mcp)
        required: true
        type: string
permissions:
  contents: read
  packages: write
concurrency:
  group: connector-images-${{ inputs.entry }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            services/credential-broker/go.mod
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # skopeo copies the OCI archive to the registry preserving the
      # provenance/SBOM referrer manifests the restricted builder emitted.
      - name: Install skopeo
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Restricted build + attested archive
        env:
          ENTRY: ${{ inputs.entry }}
        run: go run ./cmd/devcheck connector-build "$ENTRY" connector-out
      - name: Push archive with attestations
        env:
          ENTRY: ${{ inputs.entry }}
        run: |
          ref=$(go run ./cmd/devcheck connector-ref "$ENTRY")
          echo "PUSH_REF=$ref" >> "$GITHUB_ENV"
          skopeo copy --all "oci-archive:connector-out/artifact.oci.tar" "docker://$ref"
      - name: Verify pushed digest and pin catalog
        env:
          ENTRY: ${{ inputs.entry }}
        run: go run ./cmd/devcheck connector-pin "$ENTRY" connector-out/pin.json "$PUSH_REF" internal/toolhub/api/prepared/catalog.json
      - name: Catalog diff
        run: git diff -- internal/toolhub/api/prepared/catalog.json | tee catalog.patch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: connector-pin-${{ inputs.entry }}
          path: catalog.patch
          include-hidden-files: false
      - name: Reclaim this runner's build resources
        if: always()
        run: go run ./cmd/devcheck docker-clean
