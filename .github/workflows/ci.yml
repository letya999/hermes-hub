name: CI
on:
  push:
    branches: [main, dev, feat/scoped-homes-communication-hub, feat/capability-profile-122]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  main-source:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Require dev as the only main source
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          test "$HEAD_REF" = dev
          test "$HEAD_REPOSITORY" = "$REPOSITORY"
  # The race suite runs as a parallel matrix, not a single `just check`:
  # one ~50-minute monolith `go test` repeatedly lost the hosted runner
  # mid-step (job concludes failure, no logs uploaded - VM loss, not a
  # test verdict). Short independent shards stay inside each runner's
  # resource window, reruns are cheap, and a recurring shard failure
  # identifies the implicated package set instead of the whole suite.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            services/credential-broker/go.mod
      # `timeout` bounds the step so a wedge ends as a controlled step
      # failure instead of losing the runner. Output goes straight to a
      # file - never through tee: a killed `go test` leaves orphaned test
      # binaries holding the stdout pipe open, which kept tee (and the
      # whole step) alive until the job timeout destroyed every log.
      - name: go test shard
        id: gotest
        continue-on-error: true
        run: |
          set +e
          pkgs=$(go list ./... | sort | awk -v s="$SHARD" 'NR % 4 == s')
          # -coverpkg=./... keeps the shard metric identical to `just check`
          # (covergo instruments all packages per test binary); without it the
          # merged profile counts only each package's own tests and the shared
          # 85% floor rejects cross-package credit the local gate grants.
          timeout -k 30 1500 go test -race -v -shuffle=on -count=1 "-timeout=10m" -coverpkg=./... "-coverprofile=coverage-${SHARD}.out" $pkgs > "test-${SHARD}.log" 2>&1
          rc=$?
          # Test binaries run as /tmp/go-build*/b*/<pkg>.test and outlive a
          # killed `go test`; the runner waits on the whole process tree, so
          # orphans must be reaped or the step never completes.
          pkill -f '/go-build.*/.*\.test' 2>/dev/null
          exit $rc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: testlog-${{ matrix.shard }}
          path: test-${{ matrix.shard }}.log
          include-hidden-files: false
      - name: propagate test verdict
        if: steps.gotest.outcome == 'failure'
        run: exit 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.gotest.outcome == 'success'
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage-${{ matrix.shard }}.out
          include-hidden-files: false
  # Source-side gates run in parallel with the test shards; each job is a
  # separate runner so wall-clock is the slowest one instead of their sum.
  # checks-verify below stays the single required context and just asserts the
  # results - branch protection never notices the split.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            services/credential-broker/go.mod
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: coverage-shard-*
          merge-multiple: true
      - name: coverage gate
        run: |
          first=1
          for f in coverage-*.out; do
            if [ "$first" = 1 ]; then
              cat "$f" > coverage.out
              first=0
            else
              tail -n +2 "$f" >> coverage.out
            fi
          done
          go run ./cmd/devcheck coverage coverage.out 85 75
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            coverage.out
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            go.work.sum
            services/credential-broker/go.mod
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.57.0'
      - run: just lint
  docs-config:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            services/credential-broker/go.mod
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.57.0'
      - run: just docs-check
      - run: just config-check
  credential-broker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            services/credential-broker/go.mod
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.57.0'
      - run: just credential-broker-check
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            services/credential-broker/go.mod
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.57.0'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: docker/browser/package-lock.json
      - run: just security
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # history scan; a leaked secret hides in old commits
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --verbose .
  dependency-review:
    # PR-only: diffs dependency changes against the base ref, rejects critical
    # vulns and licenses outside the allowlist. Not part of the required
    # aggregate because it cannot run on push events.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          allow-licenses: BSD-2-Clause, BSD-3-Clause, MIT, MIT-0, Apache-2.0, MPL-2.0, ISC, Unlicense, CC-BY-4.0
  checks-verify:
    name: checks # main branch protection requires this status context
    if: always()
    needs: [checks, coverage, lint, docs-config, credential-broker, security, gitleaks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: assert every gate succeeded
        env:
          RESULTS: ${{ toJson(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e '[.[] | .result] | all(. == "success")' > /dev/null
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [dev, prod, stt, tts, cli-tools, cell-proxy]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            services/credential-broker/go.mod
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.57.0'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: just config-check
      - run: go run ./cmd/devcheck docker-publish "${{ matrix.target }}"
        env:
          HUB_DOCKER_CACHE_FROM: type=gha,scope=hermes-hub-${{ matrix.target }}
          HUB_DOCKER_CACHE_TO: type=gha,scope=hermes-hub-${{ matrix.target }},mode=max
      - if: matrix.target == 'dev' || matrix.target == 'prod'
        run: go run ./cmd/devcheck docker-publish "${{ matrix.target }}-control"
        env:
          HUB_DOCKER_CACHE_FROM: type=gha,scope=hermes-hub-${{ matrix.target }}
          HUB_DOCKER_CACHE_TO: type=gha,scope=hermes-hub-${{ matrix.target }}-control,mode=max
      - name: Verify baked TTS model without network
        if: matrix.target == 'tts'
        run: |
          go run ./cmd/devcheck docker-pull hermes-hub:test-tts tts
          go run -tags integration ./cmd/devcheck tts-cache-contract hermes-hub:test-tts
      - name: Verify standalone STT decoder without network
        if: matrix.target == 'stt'
        run: |
          go run ./cmd/devcheck docker-pull hermes-hub:test-stt stt
          HUB_STT_CONTRACT_IMAGE=hermes-hub:test-stt HUB_STT_CONTRACT_PYTHON=python go test -tags integration -run TestSTTDecodeContract -count=1 ./internal/devcheck
  container-gates:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        target: [dev, prod]
        gate: [smoke, native, supervisor, gateway, capabilities, network, managed, scratch]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            services/credential-broker/go.mod
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.57.0'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull immutable revision under test
        run: go run ./cmd/devcheck docker-pull hermes-hub:test "${{ matrix.target }}"
      - name: Verify exact source revision
        run: test "$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' hermes-hub:test)" = "$(git rev-parse HEAD)"
      - name: Container contract
        shell: bash
        env:
          GATE: ${{ matrix.gate }}
          TARGET: ${{ matrix.target }}
        run: |
          case "$GATE" in
            smoke)
              go run ./cmd/devcheck docker-pull hermes-hub:test-control "$TARGET-control"
              test "$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' hermes-hub:test-control)" = "$(git rev-parse HEAD)"
              docker run --rm --entrypoint docker hermes-hub:test-control --version
              go run ./cmd/devcheck docker-smoke hermes-hub:test
              if [ "$TARGET" = prod ]; then just credential-broker-docker-check; fi
              ;;
            native)
              go run -tags integration ./cmd/devcheck hermes-native-contract hermes-hub:test
              HUB_CONTRACT_IMAGE=hermes-hub:test go test -tags integration -run TestHubStdioReminderContract -count=1 ./internal/stack
              ;;
            supervisor) go run -tags integration ./cmd/devcheck supervisor-contract hermes-hub:test ;;
            gateway) go run -tags integration ./cmd/devcheck gateway-lifecycle hermes-hub:test ;;
            capabilities) go run -tags integration ./cmd/devcheck hermes-capability-contract hermes-hub:test ;;
            network) go run -tags integration ./cmd/devcheck managed-network-canary hermes-hub:test ;;
            managed) go run -tags integration ./cmd/devcheck managed-supervisor-canary hermes-hub:test ;;
            scratch)
              go run ./cmd/devcheck docker-pull hermes-hub-cli-tools:test cli-tools
              go run ./cmd/devcheck docker-pull hermes-hub-cell-proxy:test cell-proxy
              go run -tags integration ./cmd/devcheck scratch-workload-canary hermes-hub:test
              go test -tags integration -run TestDockerScratchExecPausedQuarantine ./internal/toolhub
              ;;
            *) exit 1 ;;
          esac
      - name: Reclaim this runner's build resources
        if: always()
        run: go run ./cmd/devcheck docker-clean
  containers:
    # Preserve the required status and reject failures, cancellations and skipped
    # gates. The per-target matrix keeps the "containers (dev)"/"containers (prod)"
    # contexts that main branch protection requires.
    if: always()
    needs: container-gates
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [dev, prod]
    steps:
      - env:
          RESULT: ${{ needs.container-gates.result }}
        run: test "$RESULT" = success
