name: CI
on:
  push:
    branches: [main, dev, feat/scoped-homes-communication-hub, feat/capability-profile-122]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  main-source:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Require dev as the only main source
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          test "$HEAD_REF" = dev
          test "$HEAD_REPOSITORY" = "$REPOSITORY"
  # The race suite runs as a parallel matrix, not a single `just check`:
  # one ~50-minute monolith `go test` repeatedly lost the hosted runner
  # mid-step (job concludes failure, no logs uploaded - VM loss, not a
  # test verdict). Short independent shards stay inside each runner's
  # resource window, reruns are cheap, and a recurring shard failure
  # identifies the implicated package set instead of the whole suite.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            services/credential-broker/go.mod
      # `timeout` bounds the step so a wedge ends as a controlled step
      # failure instead of losing the runner. Output goes straight to a
      # file - never through tee: a killed `go test` leaves orphaned test
      # binaries holding the stdout pipe open, which kept tee (and the
      # whole step) alive until the job timeout destroyed every log.
      - name: go test shard
        id: gotest
        continue-on-error: true
        run: |
          set +e
          pkgs=$(go list ./... | sort | awk -v s="$SHARD" 'NR % 4 == s')
          timeout -k 30 1500 go test -race -v -shuffle=on -count=1 "-timeout=10m" "-coverprofile=coverage-${SHARD}.out" $pkgs > "test-${SHARD}.log" 2>&1
          rc=$?
          # Test binaries run as /tmp/go-build*/b*/<pkg>.test and outlive a
          # killed `go test`; the runner waits on the whole process tree, so
          # orphans must be reaped or the step never completes.
          pkill -f '/go-build.*/.*\.test' 2>/dev/null
          exit $rc
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: testlog-${{ matrix.shard }}
          path: test-${{ matrix.shard }}.log
          include-hidden-files: false
      - name: propagate test verdict
        if: steps.gotest.outcome == 'failure'
        run: exit 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.gotest.outcome == 'success'
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage-${{ matrix.shard }}.out
          include-hidden-files: false
  checks-verify:
    name: checks # main branch protection requires this status context
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            services/credential-broker/go.mod
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.57.0'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: docker/browser/package-lock.json
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: coverage-shard-*
          merge-multiple: true
      - name: coverage gate
        run: |
          first=1
          for f in coverage-*.out; do
            if [ "$first" = 1 ]; then
              cat "$f" > coverage.out
              first=0
            else
              tail -n +2 "$f" >> coverage.out
            fi
          done
          go run ./cmd/devcheck coverage coverage.out 85
      - run: just lint
      - run: just docs-check
      - run: just credential-broker-check
      - run: just security
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            coverage.out
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [dev, prod, stt, tts]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            services/credential-broker/go.mod
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.57.0'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: go run ./cmd/devcheck docker-publish "${{ matrix.target }}"
        env:
          HUB_DOCKER_CACHE_FROM: type=gha,scope=hermes-hub-${{ matrix.target }}
          HUB_DOCKER_CACHE_TO: type=gha,scope=hermes-hub-${{ matrix.target }},mode=max
      - if: matrix.target == 'dev' || matrix.target == 'prod'
        run: go run ./cmd/devcheck docker-publish "${{ matrix.target }}-control"
        env:
          HUB_DOCKER_CACHE_FROM: type=gha,scope=hermes-hub-${{ matrix.target }}
          HUB_DOCKER_CACHE_TO: type=gha,scope=hermes-hub-${{ matrix.target }}-control,mode=max
      - name: Verify baked TTS model without network
        if: matrix.target == 'tts'
        run: |
          go run ./cmd/devcheck docker-pull hermes-hub:test-tts tts
          go run -tags integration ./cmd/devcheck tts-cache-contract hermes-hub:test-tts
  container-gates:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        target: [dev, prod]
        gate: [smoke, native, supervisor, gateway, capabilities, network, managed, scratch]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            services/credential-broker/go.mod
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.57.0'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull immutable revision under test
        run: go run ./cmd/devcheck docker-pull hermes-hub:test "${{ matrix.target }}"
      - name: Verify exact source revision
        run: test "$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' hermes-hub:test)" = "$(git rev-parse HEAD)"
      - name: Container contract
        shell: bash
        env:
          GATE: ${{ matrix.gate }}
          TARGET: ${{ matrix.target }}
        run: |
          case "$GATE" in
            smoke)
              go run ./cmd/devcheck docker-pull hermes-hub:test-control "$TARGET-control"
              test "$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' hermes-hub:test-control)" = "$(git rev-parse HEAD)"
              docker run --rm --entrypoint docker hermes-hub:test-control --version
              go run ./cmd/devcheck docker-smoke hermes-hub:test
              if [ "$TARGET" = prod ]; then just credential-broker-docker-check; fi
              ;;
            native) go run -tags integration ./cmd/devcheck hermes-native-contract hermes-hub:test ;;
            supervisor) go run -tags integration ./cmd/devcheck supervisor-contract hermes-hub:test ;;
            gateway) go run -tags integration ./cmd/devcheck gateway-lifecycle hermes-hub:test ;;
            capabilities) go run -tags integration ./cmd/devcheck hermes-capability-contract hermes-hub:test ;;
            network) go run -tags integration ./cmd/devcheck managed-network-canary hermes-hub:test ;;
            managed) go run -tags integration ./cmd/devcheck managed-supervisor-canary hermes-hub:test ;;
            scratch)
              go run -tags integration ./cmd/devcheck scratch-workload-canary hermes-hub:test
              go test -tags integration -run TestDockerScratchExecPausedQuarantine ./internal/toolhub
              ;;
            *) exit 1 ;;
          esac
      - name: Reclaim this runner's build resources
        if: always()
        run: go run ./cmd/devcheck docker-clean
  containers:
    # Preserve the required status and reject failures, cancellations and skipped
    # gates. The per-target matrix keeps the "containers (dev)"/"containers (prod)"
    # contexts that main branch protection requires.
    if: always()
    needs: container-gates
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [dev, prod]
    steps:
      - env:
          RESULT: ${{ needs.container-gates.result }}
        run: test "$RESULT" = success
