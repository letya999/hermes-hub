evidence:
  - Duration regression red then green through HTTPRunner and the actual usage writer.
  - Invalid-space-manifest no-spool-mutation regression and existing apply tests pass.
  - Admin audit-failure regression red then green for all three diagnostics routes.
  - Canary rollback, cleanup retention and atomic pin replacement regressions red then green.
  - Master hold authority/input boundary, restart admission denial and versioned administrative resume tests pass.
  - Master containment verifies owned immutable resources, retries after restart, and refuses resume until containment completes.
  - Old queued jobs, wakes and mapped outbox replies are fenced; new messages carry a fresh immutable admission epoch.
  - Hold notices transfer durably to the gateway outbox before acknowledgement and survive administrative resume.
  - Delivery-aware watch distinguishes pending, delivered and uncertain outcomes without printing reply content.
  - Admin diagnostics require a durable ledger and preserve administrator and target through the real endpoint writer.
  - Source hits and diagnostic error DTOs no longer echo adjacent source bytes or arbitrary provider/controller error text.
  - Scope rotation survives spool reopening; queued MCP admission no longer blocks release control.
  - Failed MCP cleanup retains capacity until verified removal succeeds.
  - #326: lease consumers/renewal/generation fencing, expected-wait classification, bounded incident ledger + signals.jsonl, one-call-per-sweep docker stats seam, WatchdogMetrics.
  - #326: shared stateless connectors track active consumer bindings; release/reconcile/idle-reap respect live consumers; persistent retention validated.
  - #326: bounded MCP recovery budget — three recoveries degrade the connection.
  - #327: budget.json atomic reservation/settlement ledger; reconcile closes crash-orphaned demand; unmeasured usage counts unknown at estimate.
  - #327: ceilings — pending per-scope/total, daily scope tokens, spool bytes, outbox deliveries, per-run tool calls, per-principal runtimes.
  - #327: control deliveries claim first and bypass the ordinary outbox cap; aged background jobs promote to foreground.
  - Measurements: .work/done/CHG-0164-m17-code-closeout/measurements.md (sweep ~57ms/20 runtimes, reserve+settle ~55ms, 20-scope claim ~18ms).
  - Targeted race gates pass for supervisor, communication, ToolHub and commodel.
  - Six changed packages passed their complete test suites; the communication wake fixture was updated for the hold projection and passes its targeted regression.
  - #328: event-driven personal supervisor — coalesced per-scope wakes, one in-flight Decide, scope-local server-validated ops (inspect/renew/pause/restart/escalate), 30-min renew bound, stale-generation denial, bounded review chaining (2) and drain (64), Decide-error applies nothing, audited personal-applied/denied signal lines, opt-in relayDecide via HUB_PERSONAL_MODEL + HUB_MANAGED_MODEL_URL (+OPENAI_API_KEY).
  - #142: certificate_ref "ca:<file>" mints fresh short-lived (10 min) user certs per dial from an operator CA key in the read-only config dir; serial+principals audited in bounded ssh-cert receipts; wrong-CA rejection and TTL/principal bounds covered end-to-end against the in-process sshd.
  - Race gates green for supervisor and sshcap after the additions; gosec/staticcheck/vet/gofmt/docs/integration-build clean.
  - 2026-10-26 live host canaries on real Docker (current tree, local runtime image): managed-supervisor-canary (spawn/internal-network/relay control/isolation attestation/restart+rollover/teardown), managed-network-canary (no default route, relay-only egress, sibling isolation), scratch-workload-canary (non-root read-only sandbox), TestDockerScratchExecPausedQuarantine — all passed.
  - #329 fix: personal restart flag now requires `desired`, closing a hole where a model restart could revive a held scope while containment hit a transient removal failure (TestSupervisorPersonalCannotRestartHeldScope red→green).
