evidence:
  - "Source base: 98514d40. No published SHA or remote run URL."
  - "Read ADR-0106, SPEC-0100, existing identity primitives, IAM link flow, channel routing, SQLite helper and spawn skill materialization."
  - "The four requested initial regressions were red against unavailable registry methods, then green with the real SQLite implementation."
  - "Real-registry identity conformance passed over in-process and HTTP transports; Telegram and canonical Slack keys resolve exactly."
  - "Atomic/idempotent migration, disabled-user refusal, duplicate-channel ownership, concurrent proof acquisition, proof expiry/account binding and forbidden transition regressions passed."
  - "System grants, org role scope, break-glass expiry/audit, failed-audit rollback and count-only diagnostic regressions passed. No first-user admin default exists."
  - "Foreign SQLite schema-1 store was accepted before the owner fence; now a read-only application-ID check refuses it without changing bytes. Direct symlinks refuse too."
  - "Layer/profile regressions were red before implementation and passed with set intersection, accumulated guardrails, explicit empty denial and mode narrowing. Spawn consumption remains pending."
  - "Company/private space aliases and removed org membership were admitted before their fences; both regressions now pass. CanAct and Template share the same acting-profile SQL predicate."
  - "Human deactivation retires owned profiles and channel proofs atomically while retaining principal tombstones. Named regression passed after one transient Windows test-launch refusal."
  - "Issuer-role revocation and expired-grant transitions exposed stale administrative authority; both regressions were red, then green with live issuer-role checks and terminal grant states."
  - "Scoped go vet passed. Targeted race regression TestConcurrentChannelProofNeverSharesAnAccount passed."
  - "Foundation checkpoint: just check passed; just test ./internal/identityhub ./contracts/identity/v1/... passed. No control/edge cutover or live migration claimed."
  - "Control now owns dev/prod registry lifetime, typed read routes and separate verified-ingress mutations. Bind failure, ownership, shutdown and credential-separation regressions passed."
  - "Gateway channel caches and the edge IAM link writer are removed. Ingress, reverse lookup, notifications and automation channel policy use the registry without a static fallback. OIDC fixture flows and revoked-account regressions passed."
  - "Shared-space policy delegated by owner: preserve explicit ACLs without a human owner, freeze empty-list membership, keep channel-only guests out of private/org spaces, and refuse disabled-identity resurrection. Named SQLite regressions passed."
  - "Explicit operator migration: count-only preview, --apply transaction, source preservation, symlink refusal, exact OIDC provenance, idempotency and dev/prod isolation regressions passed on synthetic files."
  - "Spawn template digest binds subject/owned actor/resource kind and org; mixed snapshots refuse. Narrowed skill trees/meta/SOUL paths are separate per identity, passport and environment. Parallel-profile and rebuild regressions passed; no Docker execution claimed."
  - "Reviewed and regenerated ten dependency closure additions after the hard-rule gate. Runtime reaches identity DTOs through stack settings; gateway and ToolHub use the contract. Control owns registry/SQLite access."
  - "CLI disable installs the ingress hold and deactivates the human through control with the separate admin credential and environment check. Scoped schedule cleanup uses ToolHub enrollment after the registry has retired channel links."
  - "Legacy env import, atomic rollback for a verified OIDC link to an inactive human, envelope-aligned provenance length and admin credential/Origin isolation passed named regressions."
  - "Final just check and affected package tests passed on the local source snapshot. Final gateway rerun passed after migrating the remaining three stale fixtures."
  - "Integration-tagged devcheck and ToolHub binaries compiled without Docker. The isolated TestM32ToolHubStartupAndRecovery passed. Targeted race cases passed for parallel skill views and concurrent channel proof acquisition."
