  - 'R5.3 promotion gate: eligibleText filters prov.db owner/agent + Kind=interactive before prompt build; quotes verified verbatim against eligible text only (TestPromotionGateExcludesUntrusted/Kinds, TestMutatedQuoteRejected)'
  - 'R5.4 bounded loss: rewrites dropping >MaxLossPct keep prior body + append-only fallback, journaled; in-bound rewrites preserve old body under ## History (TestBoundedLossRejects/Applies, TestTruthLossJournaled)'
  - 'R5.5 directives: supersede-in-place by key, never-evict classes pinned, owner-quote-only CORE edits (TestDirectiveSupersedeInPlace/NeverEvict, TestCoreFactNeedsOwnerQuote)'
  - 'R5.6 REVIEW.md dated sections — promotions, skips, conflicts, rejections incl. loss fallback + forged intent + missing truth target + failed intent delivery; digest rides owner-brief outbox via memory.night-digest key in all four catalogs (TestReviewJournalEntries, TestDigestQueued, journal-dedup on resume)'
  - 'R5.7 intents → owner-approval draft assignments in owner envelope, deterministic sha256 id = retry-safe, never facts/never activated (TestIntentBecomesProposal, TestIntentNeverFact, TestNightJobRunsRollup e2e)'
  - 'R5.8 idempotent resume: cached proposal replayed without relay call, changed already-processed entry halts day, cumulative call spend persisted (incl. failed calls), MaxCalls/token caps stop pre-relay pre-write, dry-run writes nothing (TestResumeFromStep, TestChangedEntryHalts, TestMaxCallsStopsBeforeRelay, TestFailedRelayStillCountsSpend, TestDryRunWritesNothing, TestDryRunFailedRelayWritesNoCache, TestSecondRunNoop)'
  - 'R5.9 folds: weekly needs all 7 terminal day states incl. no-data; monthly = full in-month ISO weeks + edge dailies; yearly = 12 monthly files; written summaries immutable (skip-if-exists, owner edits kept); gateway sweep closes last finished week/month/year after a successful run, cascades year-end, shares night cap (TestWeeklyNeedsSeven/FoldsAllSeven, TestMonthlyNeedsCompleteMonth/ComposesWeeksPlusEdges, TestYearlyNeedsTwelveMonths, TestFoldKeepsExistingSummary, TestNightTickFoldsClosedWeek, TestNightTickFoldsClosedMonthAndYear)'
  - 'wiring: gateway 60s night goroutine + nightDue gate (memory.rollup_time HH:MM space-local, empty disables), last-run marker pins run day and is NOT written on error (resume-safe), digest→owner Telegram DM outbox, intents→assignments draft seam, production relay = POST /v1/chat/completions on HUB_MODEL_RELAY_URL + HUB_MODEL_RELAY_AUTH, settings memory_rollup_time → HUB_MEMORY_ROLLUP_TIME on both config paths + compose render (TestNightDueGate, TestNightErrorLeavesMarkerUnset, TestNightProductionRelay, TestConfigFromEnvVaultAndRollup, TestGatewayRunSchedulesNightRollup, TestMemoryRollupTimeRendered)'
