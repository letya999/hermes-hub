  - 'untrusted/system + background-kind content never reaches the prompt (structural filter, not instruction) — TestPromotionGateExcludesUntrusted/Kinds'
  - 'mutated/forged evidence quotes reject the fact and journal the rejection — TestMutatedQuoteRejected, TestRejectedIntentJournaled'
  - 'owner card edit mid-pipeline wins via governed writer WantSHA + truth_pending sidecar flag (vault/writer_test.go TestConflictFlagsTruthPending; night-layer stale-hash leg counted rejected — deterministic mid-write race not simulable in a unit test)'
  - 'governed zones: all rollup writes through vault.Writer whitelist incl. memory/REVIEW.md + summaries/{daily,weekly,monthly,yearly} — out-of-zone denied by writer (vault package tests)'
  - 'DST/space-local clock: leaf day boundary in owner tz, rollup_time space-local, day assignment In(tz) — TestDSTEdge'
  - 'day-assignment edge: a 04:00 tick on D rolls up leaf D-1 (last closed day) — today-only entries are never stranded — TestNightJobRunsRollup'
  - 'no-data day costs zero model calls and no files beyond the terminal day state — TestNightSkipsEmptyDay'
remaining: []
limitations:
  - 'the run processes only the last closed day — a multi-day outage leaves older leaves unprocessed and their periods blocked from folding (conservative; no catch-up replay in this slice)'
  - 'a fold blocked by a permanently-missing day state stays unwritten until the state arrives (by design: no fold over non-terminal inputs)'
  - 'relay model is the spaces current selection via empty model field — no dedicated rollup model setting yet'
