log:
  - "2026-11-13: ADR-0099 accepted — Stage{pending|live|failed|gone} + single Gate slot, one slot per owner/definition, derived you_must/delivery contract, channel-confirmed delivery."
  - "2026-11-13: Stage+Gate landed in api.Onboarding with edge-table ValidateOnboardingTransition and UnmarshalJSON load migration (14 legacy phases + 5 nonce pairs fold). All production write-sites and ~60 test files migrated; wire vocabulary kept as NoticePhase labels incl. removed/disabled. Semantic fixes folded: stage-first NoticePhase (terminal stages outrank leftover gates), allow_writes re-enters pending while armed, revoked-only gone->pending edge for reauth, in-place removal ladder on gone, resend keyed on armed remove gate kind, disabled surfaced via binding status in statusBody + connector_list. Green: go build ./..., go vet ./..., go test -short internal/toolhub internal/toolhub/api cmd/hubctl cmd/toolhub."
  - "2026-11-14: Slot uniqueness landed — Store.onboardingSlotLocked matches (principal,context,runtime,policy,definition) for non-terminal records, excluding upgrade-keyed and shared-class records; deterministic winner ranking for pre-fix siblings (non-stub>stub, live>pending>failed, connection-bound, newest). newOnboarding is the single find-or-create (attached flag), remote_admit/remote_oauth/ensurePreparing claim through the same slot; shared installs bypass it; failed holders are superseded (different seed) or retried on-id (same seed); ensureBrokerIntake guards StageLive. Green: full toolhub package + just check."
  - "2026-11-14: Model contract landed — api/model_contract.go centralizes derivation: ModelState(disabled) -> working|waiting_you|ready|paused|broken|done, YouMust(now) -> click_link|wait|retry|remove|enable, RecordDelivery + channel-observed delivery -> not_sent|queued|sent|failed|uncertain with Delivery.Channel. OperationResult/OperationCandidate now carry State/YouMust/Delivery/Channel; LinkSent, DeliveryStatus, NextAction, OnboardingPhase removed from the model surface (statusBody keeps wire labels). Journal projects model states via connectorModelStateFromOp; internal api.OpState stays durable-only. Armed remove gate outranks live readiness; connection-only status inspects as done. Catalog 18.5.0 emitted; prompt_contract, arg_docs, capability descriptions, docs/tools.md migrated; e2e registry gained 5 acceptance cases (session_create, web_providers, web_search_multi, web_cache, native:tool_search). Green: internal/toolhub, api, agenttools, catalog, stack, communication, e2e, cmd/hubctl, cmd/toolhub, just check."
  - "2026-11-14: Delivery truth + single resolver landed — observeNoticeDelivery applied after every enqueue/requeue/remove path so journal results carry channel; sent only from durable prepare-delivery done/. id/onboarding_id aliases fold into target before capability admission (RequireConnectorTool admitted after Connectors grant in test fixture); schemas+arg_docs updated; single resolver retained for list/status/lifecycle. Regression: TestConnectorArgsAcceptIDAliases."
  - "2026-11-14: Load-quarantine + live run — storeFromSnapshot dedupes per-slot siblings deterministically (SupersedeOnboarding tombstones losers). store_db digest fixed twice for format migrations: readDBSnapshot verify hashes RAW row bytes (rawIndex), and loadDB seeds dbRows/diskDigest from the same raw index — reserialized state as the write-fence base would silently skip migrated rows and read every first save as a foreign commit. LIVE on artem_two shared store: 6 legacy records -> 5 gone+removed tombstones + 1 surviving slot; connector_install attached the armed slot (no 7th record); retry reused the failed slot and op idempotency key; POST /v1/connectors:install -> waiting_you + delivery:queued + channel:telegram_bot; /v1/operations -> delivery:uncertain + code:delivery_unavailable (channel unconfirmed, never faked sent); armed gate kind=credentials renders wizard at /connect/<id>?k= (broker form, real GitHub creds required — owner step); protected removal verified end-to-end via /remove/ page POST -> gone+removed, inventory empty. toolhub rebuilt hermes-hub-dev-artem_main-toolhub:local, healthy, serving traffic."
  - "2026-11-14: Prepare-notice wedge closed — a transient Telegram send failure parked onboarding links in outbox/failed forever (the v3/v5 link losses). Spool.RequeueFailedPrepares sweeps failed every 15s from deliveryLoop: prepare-fence first (stale versions -> superseded), 1h age gate (dead onboardings never resurrect), Attempts budget 4, NotBefore backoff 30s/2m/10m, writeJSON-then-rename so a crash can never reset the budget. Ordinary failed deliveries stay terminal. LIVE on shared spool: 4 stranded notices classified — v3/v5 (fence 8), v2 (fence 6), v12 (fence 13) all -> superseded, zero sent. docs/operations.md updated; prepare_requeue_test.go covers requeue/backoff/bound/supersede/aged/ordinary. communication-hub rebuilt hermes-hub-dev-artem_main-communication-hub:local, healthy."
