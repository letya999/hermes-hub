evidence:
  - kind: unit
    detail: "go test ./internal/passport ./internal/agenttools — all green."
    items:
      - "Ledger ∩ ceiling: a catalog-valid grant outside the merged ceiling (files.search while ceiling offers only files.read/files.write/terminal.exec) fails compilation — allow arrays compile only from trusted ceilings plus active ledger (R5.2, TestPassportCompileRejectsInvalidEdges)."
      - "Catalog ops vocabulary carries effect/scope/issuer per capability; projectGrants validates every operation against the catalog (R5.1); template layers cannot carry grants."
      - "TestGrantSnapshotRevokeBlocksDirectAndInvoke: an explicit deny in the rendered tool-policy epoch blocks the NEXT call on both the direct Call path and the invoke ExecCall path — no respawn, stale prompt/passport irrelevant; denying files does not leak onto settings (own/cross operations stay distinct); a corrupt epoch file fails closed (A5)."
      - "toolPolicyDeny reloads /config/tool-policy.json per call (HUB_TOOL_POLICY), so revocation is immediate on the runtime executor; the toolhub gateway already re-verifies live bindings per admitted call."
  - kind: static
    detail: "devcheck format clean; devcheck docs clean; docs/rbac.md documents the grants passport effective view + immediate revocation semantics."
  - kind: red_team
    detail: "Agent writing grants.yaml changes nothing — the file is read-only materialization and authorization never reads it (D-model); grants passport bound by ceilings at compile; corrupt epoch file denies rather than trusts stale snapshot."
  - kind: live_acceptance
    detail: "Deferred with reason: grant+revoke on a live two-user dev stack requires a deployed toolhub+runtime pair; tracked under M29.12 milestone acceptance. Unit evidence covers the epoch-reload semantics on both call paths."
remaining:
  - "Live dev-stack grant/revoke acceptance (M29.12)."
limitations:
  - "Issuer/why/revision provenance surfaces through catalog issuer fields + toolhub binding/policy revision audit; no separate per-grant audit record was added in this stage."
  - "grants.allow ceiling rows are capability ids; operations inside a ceiling capability are bounded by the catalog vocabulary, not a per-op ceiling."
