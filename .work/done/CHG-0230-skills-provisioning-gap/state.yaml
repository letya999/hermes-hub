live_debug_2026-10-30:
  symptom: "503 projection unavailable on /mcp; toolhub MCP parked; zero toolhub tools in managed runtimes"
  root_cause: >
    PolicyVersion(settings) rotates on any settings change (skills wishes added).
    Token envelopes are minted at the CURRENT manifest pv, but capability
    profiles and active bindings stay pinned at the pre-rotation pv.
    manifestWrite migration uses the STALE on-disk manifest pv as `from`, so it
    missed the live pv (a65c/3df8); profiles are not migrated at all.
    capabilityProfileLocked requires profile.PolicyVersion == envelope pv ->
    whole managed surface denied.
  operational_fix: >
    MigrateBindings artem_two a65c->45167d, artem_main 3df8->bdc121d (+ orphan
    connector bindings telegram-mcp/datalens/slack/notion/prometheus moved to
    live pvs); republished profiles artem_two-default rev18 @45167d,
    artem_main-default rev19 @bdc121d.
  verified: >
    Live MCP handshake from inside both runtimes: initialize 200 + tools/list
    shows 62 (artem_two) / 50 (artem_main) tools incl. all 5 skill tools.
  code_gap_remaining: >
    manifestWrite must migrate capability profiles alongside bindings and
    detect the pv active bindings actually sit at (not only previous manifest
    pv), or pv rotations keep bricking managed surfaces silently.
