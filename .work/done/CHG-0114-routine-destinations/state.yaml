  - Origin job mapping pins the source task and Telegram topic independently of mutable /use; explicit target IDs resolve only among the owner's verified live tasks.
  - Destination moves require expected revision, retain timing and history, and leave already admitted occurrences addressed to their original audience.
  - Archive, revocation and corrupt topic-binding cases fail closed; regressions cover creation races, old occurrences and legacy mapping compatibility.
  - Supported dev-rebuild completed for communication-hub and hermes-runtime; selected running containers use their new dev images and communication endpoint is healthy.
  - Actual Hermes MCP client via ToolHub listed five routine tools, listed owned destinations, created a future fixture, moved it, rejected a stale edit, inspected the card and deleted it.
  - Actual origin_job_id fixture matched the persisted source task, chat and topic; independent follow-up confirmed its tombstone and no active fixture.
  - No fixture reached its firing time; external Telegram sends in this change were zero.
  - Final just check passed race/shuffle package tests, 86.36 percent own Go statement coverage, formatting, vet, tidy diff, staticcheck, gosec, docs, actionlint and deployment configuration contract.
