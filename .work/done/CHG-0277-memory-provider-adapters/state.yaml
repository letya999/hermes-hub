red_team:
  - 'scope keys that could traverse the bank path (../, separators, %2f) refused at the adapter regardless of caller — MintScope hex output is not trusted (TestHindsightScopeKeySanitized)'
  - 'bank isolation literal: two minted scopes never see each other''s documents or recall hits (TestHindsightScopeIsolation, conformance)'
  - 'token field accepts only a secrets-env NAME — a literal credential fails validation and nothing renders (TestProviderNoSilentFallback); OpenProvider resolves it from the space env file at call time'
  - 'provider config forged in the space tree cannot mint scopes — provider.json lives under vault/runtime (hub-owned, .okignore''d, outside governed memory paths), scope.key is hub-generated there'
  - 'replay mints bank ids from hub-held material over env×principal×audience — the provider never sees raw identifiers; a corrupt or unwritable cursor refuses rather than silently re-capturing'
  - 'export-honcho goes through the import staging lane only — nothing applies without --apply, applied cards are additive and never clobber (import contract reused verbatim)'
  - 'disable removes provider.json and drops the egress host; a governance deny removes egress even with the wish present (TestProviderManagedEgress)'
