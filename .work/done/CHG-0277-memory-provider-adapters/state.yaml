  - 'live Hindsight protocol acceptance (real deployment, flush-on-stop, session-switch recall, revocation timing): pending — no Docker; the fixture verifies the wire contract only and is never claimed as deployment proof'
  - 'adapter coverage: capture/search/export/health lanes only — Recall and Write are honest ErrUnsupported (reflect ≠ evidence; governed writes stay vault-only)'
