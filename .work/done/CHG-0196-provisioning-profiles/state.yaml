notes: >
  Design decisions: profile SOUL is a render-time layer (contract→org→
  profile→user→catalog per R9.4), never stamped into the user file.
  profile.lock covers stamped files only (agent.yaml, workspace.yaml).
  grants.yaml materializes into a draft CapabilityPolicy revision via
  `hubctl profile grants` (defaults swapped, ceiling untouched); authority
  still requires `capability --kind policy --confirm` — nothing
  auto-publishes. Members accepts scalar or {role, profile}; marshal stays
  scalar when profile is empty. Legacy policies/*-default.yaml resolves as
  profile "default". Org assignment (s.OrganizationProfile) wins over the
  user-editable profile.lock at render so a member cannot pull an
  unassigned profile. skills.yaml pins order first in the effective
  catalog and ineligible pins are render-time errors. `profile apply`
  three-ways stamped files vs lock vs new profile; org overlay resolves
  through scope.yaml.
