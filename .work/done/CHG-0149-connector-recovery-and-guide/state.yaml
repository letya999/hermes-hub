limitations:
  - Owner accepted the change on 2026-10-24 with these recorded gaps, not hidden:
  - Orphan-ciphertext recoverability table (A1 tail) was not produced; encrypted orphan files stay ambiguous by design.
  - just docker-check last ran before the latest recovery/rotation edits; full container acceptance gates remain CI-side per AGENTS.md.
  - Notion/dbhub surfaces remain degraded for pre-existing reasons; the credential layer is verified active, surface acceptance is separate.
  - The channel /connections slash command is parsed only on the Telegram poll path; its live data surface (/v1/connectors per pinned principal) is what was verified, not a typed Telegram message.
  - telegram-480637186 has no projection/binding in this stack; its control surface fails closed 503 rather than serving a guide.
  - Historical attachments do not establish current credential loss.
  - Live read-only Docker checks confirm control services and the persistent Broker volume are present, not credential integrity.
  - A primary journal interrupted mid-replay can carry a divergent tail; fail-closed open then requires operator quarantine and a clean replay.
  - Master-key rotation is not supported for existing sealed data; the October incident was recovered via the independent replica, not re-keying.
  - Recovery does not resurrect primary-volume-resident config, contracts, TLS identity or master key; installation material must be preserved separately.
