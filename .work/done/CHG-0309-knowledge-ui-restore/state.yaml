                      # "listening on 127.0.0.1:18443"

notes:
  - Not restored by design: mcp_servers.open_knowledge (both renders),
    HUB_MANAGED_KNOWLEDGE_UI, MaterializeOptions.KnowledgeUI — they only
    served the retired runtime route.
  - Known ceiling: owner UI edits carry hermes-owner provenance from the
    nightly sweep, not per-save identity; a git index.lock race with a
    rollup write fails cleanly and retries next night.
  - space apply on this host needs HUB_RUNTIME_SUPERVISOR_URL=http://
    127.0.0.1:8876 — the recorded supervisor_url is the in-network name,
    unresolvable off-host.
