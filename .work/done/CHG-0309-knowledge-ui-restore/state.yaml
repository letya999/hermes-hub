  scoped_tests: pass  # knowledge/render/doctor tests green; stack,
                      # supervisor, passport, runtime -short suites green;
                      # just check green
  live_acceptance: pass # artem_two dev stack: passport published
                      # r-4df7e1ab9705a5d4 (user rule native:knowledge_ui,
                      # ports.knowledge-ui=18443, open-knowledge per-space);
                      # container hermes-hub-artem_two-dev-open-knowledge-1
                      # Healthy, mounts only spaces/artem_two/vault -> /data
