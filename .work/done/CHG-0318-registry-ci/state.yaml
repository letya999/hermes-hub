remaining:
  - Target GitLab CI Lint and pipeline execution require an operator-configured mirror and runner.
limitations:
  - Registry-side immutable SHA policy and production CA/auth must be configured by the operator; the local fixture is anonymous loopback HTTP.
  - Moving tags represent the last successful publisher; cancel superseded pipelines before retrying older ones. Deploy always selects a SHA.
  - Minimal synthetic gateway state reports routines unavailable; no real channel delivery, runtime Pods or enforcing-CNI proof is claimed.
  - Local gates do not establish remote CI acceptance; full race/coverage/security and container workflow execution remain CI responsibilities.
