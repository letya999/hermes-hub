live_acceptance: VERIFIED 2026-10-19 — telegram-mcp 0.0.6 enabled for the
  local owner; subscription watch-telegram-artemletya2 (delivery=stream,
  sink=agent, probe wait_for_new_message chat_id=@artemletya_2) received 7
  event batches within ~8 minutes; each spawned a job-stream-* occurrence
  completing in ~30-50s and replying to the destination chat. Seen-set dedup
  durable in event_state. Issue #257 closed. Earlier note: 2026-10-18 stream
  acceptance was unavailable (no wait-capable connector enrolled).
notes: >
  Stream mode = hub-owned bounded long-poll loop per event schedule through
  the existing /v1/tool-call path (30s budget); no persistent-workload mode,
  no push ingress. streamSupervisor reconciles every 2s (spawn/cancel/
  respawn); streamPoll re-reads the schedule each round, injects a wait
  bound the caller did not give, settles via settleStreamEvents, paces
  blocked rounds 1s..30s. Connector wait tools must expose a bounded wait
  arg and return either an event batch or an {"event": false} sentinel.
