red_team:
  - 'Read-labeled verb with write side-effects: caught — checkpoint
    (readOnlyHint:true but persists to git) and share_link (readOnlyHint:true
    but mints a publishing URL) are in the mutation set; lint excluded entirely
    because fix=true mutates and tools.include cannot filter arguments.'
  - 'Direct MCP bypass of the projection: no registration path — excluded
    verbs are absent from tools.include, so a guessed write call dies as an
    unregistered tool (TestWriteVerbDeniedDirect); feature-off renders no
    endpoint at all (TestOKDisabledRendersNothing).'
  - 'Path-arg escape: upstream resolveWithinRoot confines path/cwd to the
    project root, and the service mounts only vault→/data — no other host path
    is reachable (TestOKPathConfined).'
  - 'Governance revocation: denied native:knowledge_ui removes the server on
    both renders (TestManagedRenderKnowledgeServer,
    TestOKGovernanceDenyRemovesServer); the explicit-wish evaluation in
    applyGovernance fails Read on a denied selection anyway.'
limitations:
  - 'SPEC R9.1 text admits "lint (read mode)" — not enforceable: tools.include
    filters by tool name, never by argument, so lint is fully excluded. Recorded
    in the ADR amendment.'
  - 'OK writes through the UI are still owner-only (human editor); the
    agent-side write grant remains deferred to #422 pending upstream
    sub-tree write scoping.'
  - 'exec admitted on the strength of the upstream read-only allowlist
    (cat/ls/grep/find/head/tail/wc/sort/uniq/cut); its cwd arg is confined to
    the container fs — live verification of the allowlist rides the deferred
    live-acceptance pass.'
  - 'Org-scope read_only_mcp projection for knowledge_ui is not separately
    wired: the feature is a per-space flag behind native:knowledge_ui; org
    members inherit whatever the space renders. Flagged if org-scoped spaces
    need a distinct section.'
  - 'Live acceptance pending (no-docker scope): tool list verification was
    static (bundle inspection), not a live tools/list call; A9.1–A9.6 live
    checks deferred.'
