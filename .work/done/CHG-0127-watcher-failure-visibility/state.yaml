notes: >
  Failure alerts dedupe per normalized error and reset after the first
  successful probe. Agent escalation in quiet hours settles capped (cannot
  defer a model wake like a delivery). Probe kinds bypass the binding-drift
  check entirely. dev-script-image pin is supervisor-mode only; prod script
  containers keep the core image. Bundle jobs keep the resolvable ref id —
  an occurrence job id or a deterministic stream seed — so send-time
  re-authorization reaches the same schedule the settle path authorized.
