evidence:
  - "Reviewed contract types shipped: services/credential-broker/examples/contracts/model-api-key.json (bounded key -> MODEL_API_KEY env on the model-relay workload lease) and cliproxy-session.json (bounded OAuth account session file -> mounted auths file, env_name carries the path never the contents); TestShippedContractsAreValid passes both incl. ru/kk/es i18n."
  - "TestModelSessionLeaseOwnerRotationAndRevocation (broker/): two session principals plus one API key enroll, grant and lease independently — cross-principal acquire/view denied, rotation mints a new revision without disturbing the sibling session or the key, revocation kills leases at next acquire, and no sentinel byte appears in DTOs, events, the ledger or the provider store (tmpfs lease mounts are the only plaintext boundary)."
  - "Consumer wire already landed: models.yaml broker_grants + credential_env resolve per call via credentialbroker.ResolveEnv with a bounded release; docs/services/model-relay.md documents the reviewed contracts and the explicit operator migration off legacy cliproxy/auths + key_env."
