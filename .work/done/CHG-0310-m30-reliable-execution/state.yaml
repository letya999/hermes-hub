scope: |
  Four targeted fixes to existing state owners per the revised milestone
  plan: atomic conservative budgets (#400), verified run correlation on the
  ToolHub call path (#397), stable operation identity + cleanup outcome +
  operator egress (#398), post-admission dispatch + bounded recovery
  fan-out (#399). No new contracts, ledgers or queues.

implemented:
  - internal/communication/budget.go — scopeBudget.UnknownTokens carried on
    unmeasured settlement, added to the daily admission expression, reset on
    UTC rollover.
  - internal/runtime/model_meter.go — load/save return errors; new admit
    (load→check→reserve→persist under one lock, fail-closed); exhausted kept
    as pre-skip; charge removed.
  - internal/runtime/model_relay.go — per-attempt admit immediately before
    bounded.Do; quota refusal parks the hop for ladder advance.
  - internal/communication/budget_test.go —
    TestBudgetUnknownTokensHoldDailyCapacity.
  - internal/runtime/model_meter_test.go — admit atomicity, per-attempt
    charging, fail-closed load/save.
  - internal/toolhub/api/run_status.go, memory_run.go, gateway_call.go,
    gateway.go — every non-empty job/run claim verified against
    SupervisorRunAuthority; /mcp-run requires both ids; absent authority
    fails closed; typed-nil seam safe.
  - internal/runtime/mcp_proxy_lineage_test.go — real carrier e2e.
  - internal/toolhub/write_correlation_test.go — stable write correlation
    fences replay, survives reopen, parallel identical calls admit once,
    read retries never fenced, cleanup-error preserves provider result.
  - internal/toolhub/gateway_call.go, audit_ledger.go — write calls carry a
    stable correlation digest (no argument values); cleanup-error outcome.
  - internal/toolhub/api/backend.go, backend_remote.go — BackendResult.
    CleanupError; CallRemoteMCP preserves a known result on close failure.
  - internal/audit/operation.go — Ledger.Resolve: explicit outcome + bounded
    verified evidence, scoped to the owning principal.
  - cmd/hubctl/audit.go — hubctl audit pending|resolve|rollover operator
    egress; the pre-existing localized rollover implementation moved in
    verbatim so its contract is preserved under one dispatch.
  - internal/locale/strings_{en,ru,kk,es}.go — hubctl.audit-usage,
    hubctl.audit-pending-usage, hubctl.audit-resolve-usage (catalog parity).
  - cmd/hubctl/main_test.go — TestStatusReportsKnowledgeUIEdge: refreshed the
    stale pre-existing expectation (doctor reported the retired-edge format
    after CHG-0309 restored the loopback editor); failure reproduced at
    merge-base e15ff8ac, unrelated to this change.
  - internal/toolhub/gateway_call.go — default executor path runs post-
    admission (Reload + ReverifyEffective) instead of holding s.mu.RLock
    through the backend.
  - internal/supervisor/reconcile.go, supervisor.go — recoverySem bounds
    detached observation + missing-work workers (4); RecoverMissingWork fans
    out per runtime key, keeps per-key serialization, joins spawned workers.
  - internal/toolhub/post_admission_test.go — in-flight backend starves
    neither revocation nor a second owner's call; stale effective denied.
  - internal/supervisor/recovery_bound_test.go — stuck key does not starve
    another owner; pool bound + lock hygiene on starvation.

