evidence:
  - "Read issue 576, ADR-0106 D4-D7 and SPEC-0100 R6.1-R6.3. Reviewed existing runtime admission, supervisor job authority and exact-run ToolHub memory fence."
  - "Source prerequisite: 75b71b6d (CHG-0331). No published SHA or CI run URL."
  - "Control initializes four purpose-specific Ed25519 key pairs in its private schema-4 registry. The identity contract exposes a typed public-only key set. The issuer validates owner, agent, current publication and mode, and clamps expiry to the run deadline and budget."
  - "Named regressions went from missing implementation to green. Compact run signatures reject wrong purpose, foreign actor, wrong audience, invalid signature and expired token/key. A SQLite restart and HTTP public-key read preserve verification; rotation retains previous public keys for the overlap."
  - "The control-only rotation route requires distinct admin authority and the selected environment, rejects browser origins and records an audit event in the rotation transaction."
  - "Control stores immutable signed passport content by digest and activates it using compare-and-swap for each space and environment. The issuer derives a run policy from the active bundle and current registry template. Named regressions cover unsigned and mixed revisions, stale publication, key retirement and a supplied widened mode."
  - "The HTTP verifier joins signed claims to the durable task record, including assignment plan revision, exact Hermes run, current generation, actor, deadline and policy. The live fence denies on cancellation, deactivation, identity drift or superseded policy."
  - "The ToolHub assignment gate consults the active assignment plan and live tasks.delegate right. A backend-spy regression confirms that revoking the right denies both child runs while the independent interactive run remains eligible."
  - "Space apply stages a compiled bundle with distinct operator authority, journals both digests and activates the control record and generated pointer. The synthetic process-stop regression restores the prior digest after a stop between those writes."
  - "The supervisor persists the exact Hermes admission before issuing audience-specific credentials. Control delivery uses a per-job proof, and the runtime replaces incoming authority headers using its live run map. Runtime and control tests exercise the stream, private handoff and MCP correlation."
  - "The pinned /v1/runs executor binds the actual Hermes run ID in its approval context. A bundled request middleware carries that correlation to the Go loopback model proxy. It handles overlapping runs without process-global authority. Local HTTP tests use synthetic upstreams and do not verify a live Hermes deployment."
  - "ToolHub verifies signed run correlation on both MCP endpoints when configured with identity authority. Backend-spy regressions cover valid dispatch, missing and forged proof, conflicting run and job IDs, and stale generation."
  - "The communication automation service token binds the signed service identity, operation request bytes, workspace and environment. Its negative tests reject the shared legacy bearer and forged or substituted requests. The channel proof uses the separate link signing key and remains single use."
  - "ToolHub memory bootstrap checks the live admission and signed memory policy before any vault read. The regression covers a legacy unsigned admission, accepted signed recall, live revocation and an empty memory scope. Run-scoped memory also refuses a missing token or a ToolHub-audience token presented as memory proof."
  - "Managed memory recall and capture accept distinct service audiences. The signed body, space, environment and durable job establish authority. Recall is issued in-process by hub-control. Capture issuance accepts only its own scoped Communication credential."
  - "Communication issuance has an independent root credential shared only by the supervisor and Communication services. The signed issuance routes reject the old shared control bearer and proofs derived from it. Compose projects separate issuer roots for dev and prod."
  - "Synthetic HTTP tests check model and egress audience isolation, exact Hermes correlation, proxy header stripping and backend refusal. A model request that loses authority after contacting its first provider is denied before fallback."
  - "Personal supervisor model reviews outside an agent run now use a separate control-issued service token over the exact body, space, environment and live signed publication. The issuer denies deactivated spaces, and the model relay rechecks the signed monitor and model grants and live ToolHub rights before provider attempts. Synthetic tests cover missing, forged, expired, cross-space and wrong-audience proofs, body substitution, live right revocation and superseded policy."
  - "The personal model changes passed just check, the six affected package suites, the two targeted race regressions, integration-tagged compilation and Compose configuration validation."
  - "ToolHub dreaming uses an independent issuer credential and a short-lived assertion for one request and active personal publication. The Model Relay checks signed memory enablement and grants, current publication and live rights before any provider attempt. The synthetic M32 isolation and recovery scenario passed using the production issuer, verifier, relay and PDP with a synthetic provider. The scenario also caught a signed-publication pointer failure in ToolHub MCP projection caching, now covered by a focused regression."
  - "Supervised runtimes use the existing ToolHub admission path for browser and custom MCP. Local render regressions confirm the legacy headed browser sidecar shares no network with agent workloads and raw MCP passport declarations supply neither a direct MCP endpoint nor runtime authority. Operator migration of actual raw connections has not been performed."
  - "The deployed supervisor refuses new run admission without an active signed passport publication, before any runtime command. Communication skill forms, draft review and Git operations use the agent's delegated run authority and enforce signed skill rights and scope before accessing the store."
  - "ToolHub forwards delegated Communication authority for session and speech routes. The synthetic Communication regression checks rights for session management and binds queued speech to the exact signed job and conversation. Shared bearer, foreign job and foreign conversation requests do not enqueue delivery."
  - "The Docker build context includes Go contracts and the runtime image includes the Hermes correlation plugin, including deployments without a Docker host plugin mount. The image shape regression passed. A built image receipt remains pending."
  - "Local just check and just test passed across the 17 packages affected by signed run authority and the seven packages affected by independent service issuance. Two earlier shutdown regressions exposed a canceled context reaching SQLite signing-key initialization and passed after correction."
  - "Integration-tagged compilation passed for internal/devcheck, cmd/toolhub and internal/stack. Helm lint, chart renders, Compose config validation and targeted races passed. Race coverage includes channel proofs, runtime bindings, agent skill isolation, assignment revocation and the signed memory endpoints."
  - "2026-11-20 (CHG-0334 reconciliation): parked. Slices S4.1-S4.2 and the S4.3-S4.6 progress recorded above are committed on feat/m40-v1-platform (5e4952d1..380fb5aa). The remaining uncommitted work (S4.7 goal-judge model authority and related edits) is commit 6e6b53c6 on branch wip/chg-0332-run-tokens, not pushed (milestone branch hygiene renamed chore/park-chg-0332-run-tokens to the name the issue text requires)."
  - "The work is built on the v0 topology (identity in the supervisor, signed policy bundles, cmd/hub). M40.14 (issue 612) redoes run tokens on the v1 services per ADR-0106 (one run token per run with an aud list, no signed bundles) and reuses these tests and the verifier."
remaining:
  - "Redo in M40.14 (issue 612) on the v1 services; reuse the forged, alias, stale-generation, policy-mismatch and revocation-cascade tests and the verifier from this branch and wip/chg-0332-run-tokens."
limitations:
