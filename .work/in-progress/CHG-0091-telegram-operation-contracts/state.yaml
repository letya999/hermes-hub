  live_acceptance_notes: >-
    Live stack rebuilt and deployed via hubctl build/up (image 3487916a0bdf).
    Recurring "Не удалось завершить задачу." spam traced and fixed: stale
    policy pin in spaces/local/communication.users.yaml (a3c1 -> 1191),
    running hub-supervisor binary predated the Config/policy-hash change
    (rebuilt from tree), and a supervisor relaunch without HUB_ENV spawned a
    prod-bound context (empty OPENAI_API_KEY -> cliproxy 401). Relaunched with
    HUB_ENV=dev; routine jobs now complete and deliver summaries (12:46, 12:48
    UTC). Two further live defects found and fixed: applyHubCommunicationConfig
    baked the host-side materialization path into mcp_servers.hub.env
    .HUB_HERMES_CONFIG (Windows path unreadable inside the Linux runtime ->
    "media profile config is unavailable" on every image_inspect -> photo jobs
    burned the 130s execute budget and ended run.unknown); now always emits
    the container mount path /state/hermes/config.yaml, live generated config
    patched, runtime restarted. Reconcile remediation restarted runtimes on
    Hermes "degraded" readiness (host disk >=90%), which is not
    restart-remediable and killed in-flight runs -> self-feeding restart
    storm; remediation now fires only on "unavailable". Regression tests:
    TestDegradedRuntimeDoesNotRemediateUncertainJobs, updated wedged test to
    unavailable, updated hub-child env assertion to the container config path.
    End-to-end verified: real /v1/jobs photo job completed with image_inspect
    via the live hub MCP child (gen-277, run.completed, Russian description
    returned). Third live defect: the hub-agent-tools ToolHub binding for
    principal local was pinned to stale policy-a3c1, so no hub-* tools were
    projected under policy-1191 and fetchInbound's inbox_fetch failed in
    ~130ms -> every photo job ended run.unknown. Rebound via hubctl
    capability --kind agent-tools (catalog 1.3.0, bind-b43c27db, current
    policy) + toolhub restart; exact replay of telegram-837845435 with
    inbound_id then completed with a real photo description. Supervisor
    relaunched detached (PID 373524). P1/P2/P5 live retest by owner still
    pending.
