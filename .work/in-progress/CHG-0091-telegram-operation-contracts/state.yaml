  - P0: explicit hub child env (model key + effective config path) in rendered and materialized configs; real pinned-Hermes loader canary (_load_mcp_config + _build_safe_env + stdio spawn) passes on the pulled image; unrelated parent keys filtered.
  - P1: image input format determined by bytes for inspect/edit and multi-image sets; Telegram photos get safe synthetic names with detected suffix; corrupt members still block the whole provider call.
  - P2: shared routine descriptions on direct MCP and ToolHub (catalog 1.3.0); watcher URL trims surrounding whitespace and rejects control/format characters and credential URLs.
  - P3: after:<duration> resolves once on the server clock into once:<UTC>; immutable creation receipt with intent digest; locked same-ID replay returns receipt/current state; changed intent 409; foreign/legacy/retired collisions fail closed; tombstones preserve the receipt.
  - P4: approval keyboards rechecked against current request/run/generation/audience/policy/deadline/decision immediately before send; sent-keyboard receipts tracked and deleted only after applied or terminal state; send-ok/receipt-fail stays uncertain, never resent; verified owner tap on a legacy closed keyboard removes only that message.
  - P5: instructions name the real auto-delivery buckets, MEDIA marker scope, original-byte delivery and current-request-only/read-only guidance.
