  - "2026-11-05 #521 (row A1) implemented as commit 553220f3 on branch refactor/m32-track-3-engine-lock (worktree m32-track-3; renamed from codex/m32-track-3 per branch-naming hook): routines.Engine owns its mutex (NewEngine(root, deps) — no borrowed *sync.Mutex); Deps grouped into Storage/Dispatch/Delivery/Events ports plus Signal/ChannelFor/ProbeScript/LangOf; engine->owner is the only lock order (queue-admission callbacks take s.mu inside; event settlement callbacks run outside the engine lock). editRoutine RMW and PatchRoutineFields moved into the engine (EditRoutine/EditOptions); MutateProbingOccurrence added for probing-state transitions. Communication callers migrated: applySourceBatch/resumeOccurrenceBatch/settleEvents/settleStreamResults restructured into short s.mu phases with unlocked engine admission; remaining s.mu-held paths touch only lock-free engine reads (AssignmentForWake, OccurrenceCurrent, LoadSchedule, LoadWatchState, CreationReplay, ReminderState, RoutineDestination, BindRoutineDestination, TaskProbeValue). Regressions: internal/routines/concurrency_test.go (independent lock, concurrent completion/tick, concurrent assignment-wake and schedule mutation), internal/communication/routine_lock_test.go (settle-vs-dispatch deadlock regression). Gates: go test ./internal/routines PASS, go test -race ./internal/routines PASS, go test -race ./internal/communication PASS (200s), go test ./internal/communication PASS (208s), gofmt/vet clean, go build ./... PASS. Durable record formats and user data unchanged; no ToolHub startup wiring, no second clock."
