  - "2026-11-05 blocker correction (verified by reading feat/m32-track-2 commit 028f0b2a, no files copied): #514 IS implemented in the sibling track — exact-run admission via requireMemoryAdmission/requireLivePrivateRun + api.RunAuthority over the supervisor control channel, gated strictly on 'memory.' capability calls inside AuthorizeProjectedCall. The automation host has no code dependency on that memory-only gate: user-facing routine ops use the existing ToolHub verified identity+grants path, and background occurrence execution uses explicit service authority + the persisted occurrence record. Recorded as a formal-plan vs technical-dependency divergence: SPEC-0099/#522 say 'A2 requires #514', but no call in A2's surface consumes the #514 seam; the ADR/SPEC text is not rewritten here — the divergence is evidence, to be reconciled at integration time."
  - "2026-11-06 #522 (row A2) implemented: new package internal/toolhub/automation — Host owns one routines.Engine per principal rooted at root/users/<principal> (filesystem isolation); all engine ports have real implementations: StoragePort (atomic JSON/bytes on disk), DispatchPort (durable intents under root/dispatch/<principal>/<key>.json — persisted before supervisor I/O, idempotent by intent key, lost-ack converge to one logical job), DeliveryPort (durable outbox under root/outbox/ — intent persisted before communication I/O, communication outage leaves pending), EventsPort (per-principal durable seen-set under root/events/, replayed poll bodies dedupe). Host ops: CreateSchedule/UpdateSchedule/SnoozeSchedule/PauseSchedule/DeleteSchedule/ListSchedules, CreateAssignment/PauseAssignment/ListAssignments/CancelAssignment, SeedWatchBaseline/WatchStateOf, all gated by authorize(): envelope principal + host environment pin + Store.Decide('automation', op). Tick runs TickSchedules+DispatchDueOccurrences+ProbeDueOccurrencesContext per engine then reconcile+flush; Recover reloads per-user engines, re-submits un-acked intents, flushes pending outbox. ReportResult maps durable job->task then enqueues a delivery intent (completion and delivery stay separate). Real clients: HTTPSupervisorClient.AdmitJob, HTTPCommunicationClient.PostDelivery. Regressions: TestToolHubAutomationHostRestart, TestAssignmentWatchTransitionsOwnedByToolHub, TestDueOccurrenceDispatchRecoversOnce, TestAutomationHostIsolation (env mismatch, revoked rights, pause, cross-user), TestRoutineCRUDOwnedByToolHub, TestWatchEventFanoutOwnedByToolHub — all PASS; go test -race ./internal/toolhub/automation PASS; gofmt/vet/build clean; git diff --check clean. Production startup wiring and the single-owner route switch remain #523; no second clock, no memory-gate use. just check pending."
  - "2026-11-06 #522 hardening per review: Host.authorizeJob is now a REAL gate — it re-decides Store.Decide(envelope,'automation','write') on the persisted job envelope (plus environment pin), so a right revoked between admission and the due tick blocks the occurrence before supervisor submission. Proven by TestRevokedRightStopsDueDispatch (grant revoked after CreateSchedule, due tick dispatches 0 jobs). Pause before dispatch is enforced by the engine's revision staleness (paused schedule bumps revision, pending occurrence goes stale/cancelled) plus the TickSchedules Paused gate — covered by TestAutomationHostIsolation. Recovery proven against the actual engine layout, not a test-only dir: TestRecoverReadsEngineLayout seeds users/alice/schedules via a bare routines.Engine and a fresh Host.Recover surfaces it through ListSchedules. Harness clock aligned to real time (grant expiry vs engine-computed NextDue). Suite: 8 regressions PASS, go test -race PASS, gofmt/vet/build/diff-check clean."
  - "2026-11-06 #522 continuation: pending-intent submission now rechecks live right and schedule pause/revision immediately before supervisor I/O; TestPendingIntentRechecksRightAndPause passes. Dispatch mappings are scoped by principal, durable filenames are collision-resistant, corrupt intents refuse overwrite, task listing/topic binding is real, terminal results are checkpointed before outbox handoff and reconstructed by Recover after a crash, and script occurrences use the supervisor /v1/script contract. Focused go test -race ./internal/toolhub/automation -count=1 exit 0. This is still an inactive package; the HTTP harness peer for job admission/delivery is a fixture, not the production handlers. Event source-batch/filter/cursor behavior and existing spool layout compatibility need review before #522 can be marked done."
  - "2026-11-06 #522 durability fixes: recovery now rejects malformed dispatch/delivery records instead of silently skipping them; result lookup handles a job ID distinct from its idempotency key; terminal and event deliveries carry stable nonempty outbox IDs, task/topic transport fields and stable timestamps; conflicting delivery-key replays fail closed. Focused go test -race ./internal/toolhub/automation -count=1 exit 0; git diff --check exit 0. Full just check on this uncommitted source snapshot exited 0 with Go statement coverage 85.94% (>=85%); format, vet, staticcheck, gosec, docs, actionlint and integration config contract passed. This is an interim gate for an in-progress slice; it does not prove the fixture HTTP peers are live service contracts."
  - "2026-11-06 #522 service-contract work after the interim gate: ToolHub's supervisor client now uses the real /v1/jobs contract, accepts a terminal result, checkpoints it before delivery, and retries the same identity after a lost response. Supervisor Manager.Handler tests cover a fresh execution, idempotent replay and wrong bearer. Communication now has a service-only /v1/automation/deliveries route: primary bearer and principal header bind owner and stable request ID; the real outbox worker rechecks current target and live channels.send before send. HTTP tests cover replay, wrong bearer, cross-user target, disabled owner and a positive governed mock send. Task binding is durable before a dispatch intent becomes visible; a corrupt binding blocks admission. Principal workers allow a second user to dispatch while the first supervisor call or probe is slow. Focused race package and HTTP tests pass; full communication package test passed (exit 0, 158.978s). A2 is still in progress: current event port lacks source-batch/filter/cursor parity, and existing spool record compatibility needs proof. The previous just check result predates these edits; final gate pending. No Docker or dev stack touched."
  - "2026-11-06 #522 event-contract progress: moved the existing source extraction parser into internal/routines and kept communication's wrapper, so both owners use the same event IDs/text/requeue fields. ToolHub's event port now fans out discrete MCP events, checkpoints seen IDs and next_cursor, rejects duplicate source IDs, and caps its seen-set with a visible gap count. Focused extraction and event race tests pass, including two-event replay. This is not source-batch parity: stream polling, filter execution, agent sink and cursor-fed acquisition remain incomplete, so A2 is not committed."
  - "2026-11-06 #522 continuation: supervisor /v1/script now runs isolated event filters (keep/drop/urgent); ToolHub feeds a durable single-source cursor into the next MCP probe without mutating the schedule. Communication intake verifies Telegram/mock target IDs and a Slack link against the named owner; interactive delivery controls are refused. Invalid owner paths and non-directory owner roots fail closed. Focused ToolHub race and communication HTTP tests pass. A full just check attempted with default parallelism but Go cover.exe failed with Windows Access is denied; a sequential GOFLAGS=-p=1 retry was operator-interrupted before completion because A2 still has source-batch/stream/agent-sink and legacy-layout work. No full gate pass claimed for this snapshot."
  - "2026-11-06 #522 event-batch recovery: a poll response and filter verdicts are now atomically saved as one pending batch before delivery handoff. Restart drains that batch with stable delivery IDs before fetching again and advances next_cursor only after all intents are durable. TestPendingEventBatchDrainsAfterRestart injects failure on the second event, restarts the host, and observes two deliveries without duplication and cursor=2. Multi-source streams and agent sinks still require implementation; full just check remains pending."
  - "2026-11-06 #522 stream and agent path: Host.Tick creates durable stream occurrences under its sole clock; bounded fan-out uses separate source cursors and event namespaces. The pending batch checkpoints the agent-job plan before admission, retries stable IDs after restart, and enforces one agent wake or eight notify deliveries per batch, local-day caps and quiet windows. A probe revision change with an unfinished batch now fails explicitly instead of discarding it. Reconcile drains every pending job for a principal, not only the first. Focused ToolHub race tests cover stream restart, pause, cursor gap, daily cap, agent job, admission retry and multi-job recovery; full just check on this snapshot remains pending."
  - "2026-11-06 #522 first full gate: GOFLAGS=-p=1 just check exited 0, Go statement coverage 85.88%, go vet, go mod tidy -diff, staticcheck, gosec, docs/actionlint and integration config contract passed. This gate preceded the final terminal-localization edit. The host now resolves failed/cancelled/interrupted messages through locale.LangOf(owner workspace) and preserves the recorded text on replay after a language preference change; TestTerminalFailureUsesOwnerLanguage and the full ToolHub automation race package pass. Final just check on this later snapshot is pending."
  - "2026-11-06 #522 final A2 gate: stream daily-cap and split agent batches retain the durable source receipt until every event is admitted or dropped; the cursor advances only after draining. The regression prevents a second poll from supplying the omitted event. go test -race ./internal/toolhub/automation -count=1, just docs-check, git diff --check, and sequential GOFLAGS=-p=1 just check exited 0; full Go statement coverage 85.88%, with vet, mod tidy -diff, staticcheck, gosec, docs/actionlint and integration configuration contract passed. The local ignored .work/tmp/go-retry.exe wrapper retried transient Windows temporary test-executable launch failures. No Docker or production startup test was run for A2."
