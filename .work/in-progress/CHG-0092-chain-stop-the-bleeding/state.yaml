evidence:
  - internal/communication, internal/supervisor, internal/runtime, internal/diagnostics, cmd/supervisor, cmd/hubctl tests green for all slice behaviors; full `just check` green (coverage 85.20%).
  - Red-team covered by tests: header injection (TestHTTPLogDropsInvalidJobID), post-admission retry abuse (uncertain classification tests), heartbeat spoofing (mismatched RunID rejected), restart-under-lease (lease guard tests), auth-file symlink/empty/permission attacks, routine session isolation (routine_isolation_test.go), duplicate-poller notice dedupe (TestGetUpdatesConflictNotifiesOwnerOnce).
  - A0.1: live mock-channel run through real supervisor+runtime crossed heartbeat boundaries; /v1/jobs streamed 64.9s then delivered one clean 31KB answer; no uncertain/error record. Heartbeat frames observed admitted->heartbeat->completed on direct supervisor stream probe. Strict >5min variant not shown: the configured model completed every prompt in ~60-65s; the mechanism (idle deadline + heartbeats) is what was proven, and run budget remains the cap.
  - A0.2/A0.3: taskkill'ed hub-supervisor.exe mid-run (~80s into an active stream), restarted ~35s later (manual restart, not the Scheduled Task — the installer exists but the task was not installed in this session). The original run reconciled: one -uncertain notice, then exactly one final -response; no duplicate execution. The runtime container was adopted (kept Up across supervisor restarts, no second container).
  - A0.5: agent routine `a05-failer` (kind=agent, * * * * *, principal `local`, mock chat 9002) produced 14 occurrences, all failed -> exactly ONE `job-routine-*-error` delivery ("Не удалось завершить задачу.") to the owner chat; digest dedupe verified live. Schedule deleted after the run.
  - A0.6: second gateway container (same TELEGRAM_BOT_TOKEN, scratch /data) conflicted with the live poller; each gateway logged `telegram-conflict` on repeated 409s but sent exactly ONE owner notice each (verified via telegram-sent log lines; dup poller then removed).
  - Uncertain-job reconcile observed live: job mock-98a8 (user `local`, stale pre-heartbeat runtime image) re-drove /v1/resume every ~60s without spamming the owner (single uncertain notice via idempotency), then delivered the real response when the run completed ~11min later.
remaining: []
limitations:
  - Windows Scheduled Task operation is superseded by the owner-requested container supervisor in CHG-0097; both legacy tasks were removed with backups. The 305-second heartbeat and restart-adoption paths passed in Docker acceptance (CHG-0095 evidence.md).
  - Uncommitted CHG-0090/CHG-0091 work is present in the working tree and is not part of this change; untracked in-flight CHG-0093 files (rights.go, exclusion/migrate/manifest tests) were gofmt'd and the manifest emitter implemented because `just check` gates on them.
  - Historical live runtime used a pre-heartbeat image and its >60s-silent runs hit the idle deadline. During the 2026-10-14 continuation that exact container reached exited with zero leases; supervisor cleanup remains degraded pending the tested fix (see CHG-0095 evidence.md).
  - Live provider-dependent paths were exercised through the real model relay (gemini-3.8-flash-high after upstream renamed 3.7); provider config drift is outside the repository.
  - A stale `hermes-context-*-ctl` sidecar in `Created` state permanently blocked runtime spawn (name conflict) and had to be removed by hand; orphan-sidecar self-healing is a candidate for CHG-0095 recovery work.
