completed:
  - Audited live dev stack logs, supervisor/ToolHub/Hermes state and 20 agent sessions (see research.md).
  - Researched OpenClaw, NanoClaw, GoClaw, Iva, Open Dots, noclaw, Hermes upstream, MCP, Telegram, Anthropic and durable-execution sources.
  - Wrote ADR-0036, SPEC-0053 and stage plans CHG-0092..CHG-0096.
  - S0.1 idle deadline 60s + 15s heartbeat frames + single HUB_RUN_BUDGET across runtime, supervisor and gateway stream hops.
  - S0.2 pre-admission retry bounded by HUB_COLD_START_BUDGET; post-admission failures stay uncertain and are never retried.
  - S0.3 docker restart --time 30 at both restart sites; lease guard on reconcile remediation, /v1/restart and restart-request marker.
  - S0.4 warm TTL default 30m shared constant; operator pin keep-alive verified by existing test.
  - S0.5 loopback default listen, -allow-wildcard-listen opt-in enforced inside supervisor.Serve (flag-parse AND serve-time, covering hubctl-spawned supervisors), -auth-file with symlink/empty/permission rejection, -auth deprecation warning, Windows Scheduled Task installer, systemd docs.
  - S0.6 routine conversation isolation (routine-<scheduleID>), failure digest dedupe in schedule state, interactive-first ClaimJob, legacy in-flight migration coverage.
  - S0.7 telegramStatusError + HTTP 409 conflict branch: telegram-conflict log, one deduped owner notice, 60s backoff, silent retry; hubctl duplicate-token guard already existed.
  - S0.8 X-Hub-Job-ID on execute/artifact/usage/restart/cli-jobs-release hops, diagnostics.HTTP validates via identity.ValidID, UTC log flags in all cmd mains.
  - Live-acceptance fix: worker recorded failed jobs as status="completed" in logs/audit when Run() errored (Status preset before checking runErr); now failed. Regression: TestFailedJobLogsFailed.
  - Live-acceptance fix (R1.4 head start): render emits generated/tool-manifest.<env>.json (schema/context/policy_version/projected/direct; toolhub and managed-mode builtin MCP connectors project, native/mcp-raw direct, off absent). TestManifestRendered.
