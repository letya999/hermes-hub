    owns the established stream lifetime, so cancelling it on success killed
    SSE connections ~4s in (caught by TestConnectNetworkLiveSSE)
  - just check green: -race -shuffle all packages, own Go statement coverage
    85.00% (>=85), format/vet/staticcheck/docs/actionlint clean
