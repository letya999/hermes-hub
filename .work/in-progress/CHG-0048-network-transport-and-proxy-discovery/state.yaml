    /proc scan, connected over SSE, initialize + tools/list returned all 14
    Slack tools
  - hubctl up on spaces/local --env dev: both images rebuilt, all containers
    healthy; MCP status for the enabled slack onboarding returns phase
    enabled with 15 projected tools on the new binary
  - bugfix found live via gitlab-mcp prepare (onboard-7c27621482b349cb0a384607
    failed): zereight/gitlab-mcp reads GITLAB_OAUTH_CALLBACK_PROXY — a
    user-supplied OAuth callback URL, not an egress var. It landed in both
    Environment and ProxyEnvironment and failed definition validation as a
    duplicate. mergeProxyEnvironment now takes claimed names (Environment +
    Credentials + RuntimeEnvironment); user-supplied inputs win over
    controller-injected proxy claims. Test
    TestMergeProxyEnvironmentSkipsClaimedNames; just check green (85.02%)
