  - "2026-10-25 live failure root-caused: run goal-t-4563be49-e1-dmdszt59bfd5 died on HTTP 502 'model route unavailable' — modelCall hardcoded a 30 s per-hop bound while modelRelayLimits's validated hop timeout was discarded; cliproxy-artem_two exceeded it, the single hop cooled 60 s and every retry saw 502. Fixed: handlers pass the validated bound into modelCall and the default rose to 2 m (= request budget; doc updated). Second defect: a terminally failed goal turn never reached goal post-processing, leaving the record zombie-active with nothing queued. Fixed: retryableJobFailure retries goal turns once, pauseGoalAfterRunFailure parks the record with a bounded reason and the error delivery carries a /goal resume hint."
  - "2026-10-25 regression red/green: TestModelRelayDefaultHopBoundCoversLongCompletions, TestGoalTurnRunFailureRetriesThenPauses (paused record, one retry, one resume-hinted error). go test -race ./internal/communication ./internal/runtime green; just check passed at 86.52%."
  - "2026-10-25 live resume acceptance: /goal resume on t-4563be49 enqueued a turn that ran ~40 s; run ended 502. New code behaved correctly end-to-end — automatic -r1 retry, then goal record paused with last_reason 'run failed' and a single error delivery carrying the /goal resume hint. Root cause of the 502s traced further: relay had been recreated onto the stale base image hermes-hub:0.3.0-dev (2026-10-22), whose registry path predates the cliproxy->OPENAI_API_KEY mapping, so the relay forwarded the relay-auth token upstream -> cliproxy 'Invalid API key' -> hop cooldown -> 502s. Fixed by building hub-runtime dev overlays per user space (hermes-hub-dev-<user>-model-relay:local) and recreating both relays; relay->cliproxy end-to-end POST now returns 200. Default ladder model also moved to gemini-3-flash in models.yaml + generated registries after gemini-3.8-flash-high started returning upstream 401 (other catalog models verified 200)."
  - "2026-10-25 second live resume: turn ran ~3 min, then cliproxy answered 200 at exactly 2m0s — the relay's 2 m request bound fired context-deadline at the same instant, parked the hop, and r1 died on the cooldown. Goal record correctly paused again. Raised per-space env to the validated ceilings HUB_MODEL_RELAY_HOP_TIMEOUT=5m / HUB_MODEL_RELAY_TIMEOUT=10m (modelRelayLimits caps), relays recreated onto the dev overlays; relay->cliproxy smoke 200."
  - "2026-10-25 third live resume: FIRST goal turn completed end-to-end (2849-char reply, judge verdict continue, turns_used=1) — but the queued continuation died instantly on 'empty Hermes prompt': hub-engine GoalResult has no ContinuationPrompt (native-sidecar field only), so goalAfterJob enqueued a textless job. Fixed per SPEC-0074 R3b: empty prompt now restates goal + last verdict reason. Red test TestGoalAfterJobHubContinueRestatesGoal -> green; communication-hub dev overlay rebuilt and healthy."
