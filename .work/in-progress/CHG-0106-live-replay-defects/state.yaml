notes: >
  Watcher defect decomposed into three real bugs: 256KiB body cap rejected
  every real page (github issues page is 398KB), watchValue ignored non-first
  capture groups so alternation regexes produced empty values forever, and
  settleProbe discarded the real error into a constant string. Notion public
  pages additionally serve a 20KB JS shell — no HTML regex can see content
  edits; guidance now steers agents to probe_kind=mcp_tool or static markers,
  and routine_list exposes the real err. Contract-side: missing broker
  contract now names uncovered credential names at prepare time and the
  rejected contract id at request time; the notion-token contract file was
  restored to spaces/local/broker/contracts and synced into the broker
  volume (broker restart required — contracts load at startup).
