limitations:
  - >-
    Tunnel workload runs in-process (x/crypto/ssh client inside
    hermes-runtime), not as a separate admitted container: ADR-0077 D2
    framed a per-binding docker workload; the in-process provider removes a
    whole image/admission path but concentrates the outbound connect on the
    runtime. Egress reachability is not admission-bounded — the provider
    dials relay.host:port directly. Revisit if a separate egress sandbox is
    required.
  - live acceptance requires an operator VPS + domain (sish) — not available
    in this environment; unit tests use a fake SSH relay, which does not prove
    provider deployment success.
  - idle reap deliberately deferred: no provider-side traffic stats today;
    lifetime ceiling is the backstop.
