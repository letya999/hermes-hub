notes:
  - broker contract files must be owner-readable only and owned by the broker
    euid (10001): docker cp lands root:root and securefs ErrUnsafe crash-loops
    the broker — write via `docker exec -i ... sh -c 'cat > f && chmod 0600'`
    as the agent user, or a helper container `docker run -v <vol>:/v alpine`
    that can chown 10001:0 (the broker container has no root user for exec)
  - broker contracts are immutable by key id@revision: a live request/grant
    stores the contract digest and boot replay hard-fails ("state conflict")
    if the file content changed. Bump `revision`, keep the old revision's file
    alongside (loader reads every *.json; embedded digest must match the old
    revision byte-for-field, whitespace is normalized by strictjson)
  - the placeholder probe ("NAME=preflight" for every required input) lets
    config-presence-gated servers list their tools during review; auth is
    still proven only at credential submit and at first real call
  - mcp-atlassian validates tokens lazily per request, so an invalid token can
    pass the form probe; the first real call surfaces the provider's auth
    error instead
