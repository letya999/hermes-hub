done:
  - voiceReadiness reports STT and TTS separately; each requires a configured
    worker command that resolves to a runnable binary; a parked
    HUB_TTS_UPLOAD_URL counts TTS unavailable
  - /voice status shows both directions; /voice on without usable TTS warns
    that replies stay textual instead of promising voice
  - handleVoice: unconfigured STT replies "not configured" and skips the
    Telegram download; configured-but-failing STT keeps the failure reply
  - tests: readiness matrix (unset/missing binary/resolvable/upload-parked),
    /voice on warning, unconfigured-STT reply without a job
  - SPEC-0038 added, SPEC-0021 cross-referenced, index/CHANGELOG updated
done_extra:
  - root cause of live STT failure fixed: hub-stt existed but faster-whisper
    was absent from the image — now installed (faster-whisper==1.2.1, voice
    extra still excluded)
  - hub-tts added (espeak-ng -> ffmpeg -> OGG/Opus stdout); transcription
    feature exports HUB_TTS_COMMAND — /voice can actually become ready
  - delivery semantics: /voice on now sends voice INSTEAD of text; a VOICE:
    marker line in the model reply requests speech per message (marker-only =
    voice-only, text+marker = both); failed synthesis/upload falls back to
    the spoken payload as text; Slack unaffected
  - synthesized audio is in-memory only — never written to spool, workspace
    or tts /data; spoken text stays the canonical durable record
  - tests: extractVoiceLines, voice-only/mixed/fallback delivery matrix,
    parked-upload fallback
