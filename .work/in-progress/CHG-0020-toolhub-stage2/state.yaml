notes:
  - Stage-1 CHG-0019 remains in the worktree and is not rewritten.
  - Current Hermes runtime routing remains unchanged until explicit later rollout.
  - Docker smoke and pinned Hermes 0.21.0 contract passed, including actual five-minute idle shutdown and cold restore; no live provider account was used.
  - The direct contract probe fails closed without TOOLHIVE_VMCP_ENDPOINT, TOOLHIVE_REMOTE_TOOL and TOOLHIVE_STATEFUL_TOOL.
  - Local upstream evidence used the official ToolHive v0.48.0 source commit c25e508592bc3bcfa10dea99af04daaf341db95a: one remote MCP workload and one digest-pinned local stateful-container fixture were discovered by vMCP. A bind-mounted fixture state file survived thv stop/start; the current vMCP call path is recorded unavailable below.
  - The local ToolHive probe used anonymous vMCP auth and non-production fixtures; discovery and bind-mounted state persistence were observed, but vMCP logs show `no backends returned capabilities` followed by session termination while the remote fixture was unhealthy/stopped. It is not evidence of a live provider, target Linux VPS resource enforcement, or Hermes reconnect.
  - Runtime wiring is opt-in: `HUB_TOOLHUB_ENDPOINT` injects one authenticated MCP entry; `HUB_TOOLHUB_AUTOSTART=true` starts `hub-toolhub` against `HUB_TOOLHUB_STORE`. Unset variables preserve generated direct MCP.
  - Container MCP execution now fails closed unless the private `HUB_TOOLHIVE_ADMISSION_ENDPOINT` accepts the plan; definitions require exact ToolHive and digest-pinned sidecar metadata. Local ToolHive v0.48.0 still reported mutable sidecars and no resource limits, so those gates remain unavailable.
  - `MCPGODEBUG=allowsessionsinstateless=1` is baked into the runtime image for Hermes legacy session headers; ToolHub authorization remains per request and the vMCP adapter disables standalone SSE.
  - CHG-0021 adds controller enforcement attestation, manifest-backed migration and persisted projection revisions; it does not rewrite this accepted stage-2 history.
