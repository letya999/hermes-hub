evidence:
  - Hosting-only Go controller admits pinned go-http through explicit runsc or kata
  - Pre-start and post-start inspect reject unsafe mounts caps devices networks credentials and limits
  - Network-none OCI exec relay has fixed destination and bounded requests responses
  - Non-dumpable Linux PID1 executes the committed /work/app ELF and enforces immutable expiry
  - Publish rejects a missing or non-ELF app before snapshot work and marks it executable at commit
  - Serialized fleet reservation bounds global workloads and owner overlap across environments
  - TestHostingFleetConcurrentCapacityAndOwnerScope and profile drift negatives cover controller contracts
  - Profile corrected to go-http per ADR-0081 amendment of 2026-10-26; Python runtime and env surface removed
