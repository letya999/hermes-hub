notes:
  - mock channel: POST /v1/mock/message injects through the real pipeline
    (ResolveTask + enqueueChannelJob + spool), client_id is the idempotency
    handle; GET /v1/mock/outbox lists captured deliveries for the caller only
  - mock chats bind durably to the first principal under spool/mock-links —
    a foreign principal gets 403 on inject and an empty outbox; capture
    records owner at deliver time under spool/mock-sent
  - channel=mock allowed in schedules/occurrences/authorization; mock
    routines carry MockEnvelope so the whole phase-B surface (reminder,
    watcher, check, digest, script) is exercisable offline
  - hubctl apply -f file.yaml --spool <dir> --user <id>: declarative routines
    + knowledge on the local spool (yaml.v3, already a dependency); reapply
    is a no-op, divergent spec is a loud conflict, never silent mutation
  - kind=check rejected in apply: baseline needs a live probe — use the hub
    API; knowledge applies create/update, never delete
  - image discipline: devcheck.BuildKitEnv is now the single source shared
    by devcheck builds and hubctl dockerCLIEnv; both paths verified by tests
    (arg shape, cache flags, keep-set and residue cleanup already covered)
  - No Docker daemon touched: all verification is unit-level via injected
    runners; heavy gates stay in CI as before
verification:
  - go test ./internal/communication ./internal/identity ./cmd/hubctl
    ./internal/devcheck — green
  - just check — green: race+shuffle, coverage 85.07% (gate 85), vet,
    staticcheck, docs, actionlint
  - Docker daemon gates not run (unit-level only, no image builds in scope)
