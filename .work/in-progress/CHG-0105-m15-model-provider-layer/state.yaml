notes: >
  model-relay ladder: strict hop specs name=url|KEY_ENV, ordered fallback on
  401/403/429/5xx/transport, 1min cooldown, /v1/hops, per-attempt audit logs,
  X-Model-Hop. profiles.yaml default->named->owner overlay for
  model/model_url/cliproxy/model_fallbacks; cliproxy:dedicated renders
  cliproxy-<user> aliases on both networks for non-infra spaces. hub-media:
  HUB_MEDIA_ENGINES + HUB_MEDIA_MODEL_ROUTES logical->engine:provider_id
  routing, genRouter sync+async with per-hop receipts, command engine
  (stdin prompt / stdout bytes / HUB_MEDIA_REQUEST_* env), SubmitHandle
  {remote_id,engine,model} persisted on Job so restart resumes the accepting
  engine without resubmit.
registry_v2: >
  model_fallbacks removed from agent.yaml/profiles; layered models.yaml
  (spaces -> org -> user) merges into generated/models.<env>.yaml mounted ro
  at /run/models.yaml. Relay registry mode: per-hop provider model remap,
  owners: grants, mtime reload, model-select.json state dir, PUT /v1/model
  admin endpoint (HUB_MODEL_RELAY_ADMIN via model-relay.auth), shared alias
  model-relay-<user>:8318, gateway /model command + HUB_MODEL_RELAY_URL env.
  cliproxy stays a builtin provider id overridable per-space (dedicated).
