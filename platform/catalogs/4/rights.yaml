release: "4"
definition_id: hub-agent-rights
capabilities:
    agents:
        description: 'Rights over the agent''s own runtime and peer agents: self-inspection, restart and monitoring.'
        operations:
            inspect_other:
                subject: cross
                scope: service
                issuers:
                    - platform
                    - org
                pep:
                    - supervisor
                effect: read
                description: Inspect another space's runtime state where the org permits.
            inspect_self:
                subject: self
                scope: service
                issuers:
                    - platform
                    - org
                    - operator
                pep:
                    - supervisor
                effect: read
                description: Inspect own runtime state, sessions and configuration view.
            monitor_self:
                subject: self
                scope: service
                issuers:
                    - platform
                    - org
                    - operator
                pep:
                    - supervisor
                effect: read
                description: Read own health, watchdog and supervision status.
            restart_self:
                subject: self
                scope: service
                issuers:
                    - platform
                    - org
                    - operator
                pep:
                    - supervisor
                effect: control
                description: Request a supervised restart of the own runtime.
    channels:
        description: 'Rights over communication channels: sending messages and voice out of the space.'
        operations:
            send:
