# Hermes Hub space settings — seeded for every user; edit per space.
schema: 2
user: __USER__
model: ""
model_url: ""
timezone: UTC
gitlab_host: gitlab.com
oauth_port: 8000
browser_port: 6080

# capability_mode: managed plus capability_profile_id/capability_generation
# go here once the operator publishes a capability profile for this space.

# tools: the single capability surface. Each entry picks a backend:
#   native        — upstream Hermes toolset inside the runtime; no per-call
#                   admission, no call audit, revokes on respawn only
#   toolhub       — managed executor: per-call admission, audit, os.Root scopes
#   mcp[:server]  — builtin connector or an mcp_servers definition
#   off           — explicit deny; absent means denied
tools:
  file:
    via: toolhub
    paths: [docs]
  documents: toolhub
  images: toolhub
  todo: native
  memory: native
  browser: mcp        # playwright read/navigate; tools: {act: true} adds mutations
  hh: toolhub
  # terminal: native    # relaxed grant: full workspace reach, no call audit
  # code_exec: toolhub  # sandboxed execution in a disposable container
  # ssh: {via: toolhub, tools: {write: false, shell: false, tunnel: false}}
ingress: []
workspace:
  mounts: []
