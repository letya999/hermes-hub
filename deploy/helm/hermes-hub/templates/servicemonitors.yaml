{{- if .Values.serviceMonitor.enabled }}
{{- range $name := list "communication-hub" "supervisor" }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "hub.name" $ }}-{{ $name }}
  labels:
    {{- include "hub.selector" (dict "root" $ "name" $name) | nindent 4 }}
    {{- with $.Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  namespaceSelector:
    matchNames: [{{ $.Release.Namespace | quote }}]
  selector:
    matchLabels:
      {{- include "hub.selector" (dict "root" $ "name" $name) | nindent 6 }}
  endpoints:
    - port: http
      path: /v1/metrics
      interval: {{ $.Values.serviceMonitor.interval }}
      scrapeTimeout: {{ $.Values.serviceMonitor.scrapeTimeout }}
      authorization:
        type: Bearer
        credentials: {{ toYaml (index $.Values.serviceMonitor.credentials $name) | nindent 10 }}
{{- end }}
{{- end }}
