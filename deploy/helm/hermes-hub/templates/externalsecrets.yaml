{{- range .Values.externalSecrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
spec:
  refreshInterval: {{ default "1h" .refreshInterval }}
  secretStoreRef: {{ toYaml .secretStoreRef | nindent 4 }}
  target:
    name: {{ .name }}
    creationPolicy: Owner
  data: {{ toYaml .data | nindent 4 }}
{{- end }}
